#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "rust"
version = "0.1.0"
authors = ["Mikkel Mørk Hegnhøj <mikkel@fermyon.com>"]
description = ""

[[trigger.http]]
route = "/..."
component = "rust"

[component.rust]
source = "target/wasm32-wasip2/debug/rust.wasm"
allowed_outbound_hosts = []
[component.rust.build]
command = "cargo build --target wasm32-wasip2"
watch = ["src/**/*.rs", "Cargo.toml"]
